[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ehr-graphrag"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2", "networkx>=3.3", "rapidfuzz>=3.9", "pyyaml>=6.0", "anthropic>=1.0"]

[project.scripts]
ehr-graphrag = "ehr_graphrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
